<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2f5fa"/>
      <stop offset="48%" stop-color="#d9dbe0"/>
      <stop offset="70%" stop-color="#e8d58a"/>
      <stop offset="100%" stop-color="#f4c83f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Rounded favicon background -->
  <rect width="512" height="512" rx="105" fill="#050507"/>

  <!-- Logo text -->
  <text x="256" y="292"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="91"
        font-weight="900"
        letter-spacing="-5"
        fill="url(#textGradient)"
        filter="url(#shadow)">&lt;BASKOTA/&gt;</text>
</svg>
